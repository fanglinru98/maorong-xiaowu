<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>彻子小屋 · 真机诊断</title>
<style>
body{margin:0;background:#000;color:#0f0;font:700 13px/1.5 Consolas,'Courier New',monospace;padding:6px;box-sizing:border-box}
pre{margin:0 0 6px;white-space:pre-wrap;color:#ff0;font-size:13px}
iframe{width:100%;height:62vh;border:1px solid #f00;background:#222}
</style>
</head>
<body>
<pre id="out">正在采集真机数据…（若 10 秒后仍无数据请截图现状发回）</pre>
<iframe id="f" src="./index.html"></iframe>
<script>
var rows=[];
function log(k,v){rows.push(k+" = "+v);document.getElementById("out").textContent=rows.join("\n");}
log("UA",navigator.userAgent.slice(0,120));
log("screen物理",screen.width+"x"+screen.height+"  dpr="+devicePixelRatio);
log("顶层视口",innerWidth+"x"+innerHeight);
var f=document.getElementById("f"),tried=0,collected=false;
function loadGame(){f.src = tried===0 ? "./index.html" : "./"+encodeURIComponent("毛茸小屋V22demo.html"); /* 线上=index.html；4399 本地=真实文件名，自动探测回退 */}
f.addEventListener("load",function(){
  setTimeout(function(){
    var ok=false;
    try{ok=!!f.contentWindow.document.querySelector(".screen")}catch(e){}
    if(!ok && tried===0){tried=1;loadGame();return}
    if(!collected)collect();
  },600);
});
function collect(){
  collected=true;
  setTimeout(function(){
    try{
      var w=f.contentWindow,d=w.document;
      log("游戏视口 innerW/H",w.innerWidth+"x"+w.innerHeight);
      log("visualViewport",w.visualViewport?(w.visualViewport.width+"x"+w.visualViewport.height+"  offY="+w.visualViewport.offsetTop):"(无)");
      var sc=d.querySelector(".screen"),tf=getComputedStyle(sc).transform,r=sc.getBoundingClientRect();
      log("壳 transform",tf);
      log("壳 rect","x="+r.x.toFixed(1)+" y="+r.y.toFixed(1)+" w="+r.width.toFixed(1)+" h="+r.height.toFixed(1));
      log("壳/底/兜底色",getComputedStyle(sc).backgroundColor+" | "+getComputedStyle(d.body).backgroundColor+" | "+getComputedStyle(d.documentElement).backgroundColor);
      var c=d.getElementById("roomIso"),cr=c.getBoundingClientRect();
      log("画布 rect","w="+cr.width.toFixed(1)+" h="+cr.height.toFixed(1)+"  内部="+c.width+"x"+c.height);
      try{w.__roomHooks.tutStart();}catch(e){log("触发引导","失败:"+e.message)}
      setTimeout(function(){
        try{
          var th=d.getElementById("tutHole"),tr=th.getBoundingClientRect();
          log("引导框 rect","x="+tr.x.toFixed(1)+" y="+tr.y.toFixed(1)+" w="+tr.width.toFixed(1)+" h="+tr.height.toFixed(1)+"  opacity="+getComputedStyle(th).opacity);
          log("版本号显示",(d.getElementById("verTag")||{}).textContent);
          log("—— 以上数据截图发回即可 ——","");
        }catch(e){log("引导框读取",e.message)}
      },1200);
      }catch(e){log("ERROR",e.message)}
  },4500);
}
loadGame();
</script>
</body>
</html>
