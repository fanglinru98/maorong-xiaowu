<script>/* v31gate：老板版跳板=自动带 ?boss=1 进游戏（全部功能解锁）；玩家继续走 index.html，不加任何参数。

(function(){
  function jump(u){try{location.replace(u+"?boss=1")}catch(e){}}

  fetch("index.html",{method:"HEAD"}).then(function(r){jump(r.ok?"index.html":"毛茸小屋V22demo.html")}).catch(function(){jump("毛茸小屋V22demo.html")});
})();</script></head>
